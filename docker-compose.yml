services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codefolio_api
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db
    environment:
      MONGO_URI: mongodb://db:27017/codefolio
      JWT_SECRET: your_super_secret_key_here

  db:
    image: mongo:6.0
    container_name: codefolio_db
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
